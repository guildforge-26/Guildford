# ATS board targets checked every run for public job postings.
#
# Supported board_type values: greenhouse, lever, ashby, workable.
# Each is a public JSON API meant for embedding job boards on a company's
# careers page -- reading it is not scraping and doesn't touch LinkedIn or
# Indeed's terms of service.
#
# RESEARCH FINDING (checked live, September 2026): briefing.txt Part G's
# starter list -- Chandos, Ledcor, Graham, PCL, Clark Builders, Carlson,
# ASTRA, Style Developments, BAM, MNP Corporate Finance, Sequeira Partners,
# Stack'd Consulting -- does NOT use Greenhouse, Lever, Ashby or Workable.
# What was found instead:
#   - Ledcor:        Workday, at jobs.ledcor.com
#   - Clark Builders: Workday, at cbgoc.wd3.myworkdayjobs.com/cb
#   - PCL:           proprietary (careers.pcl.com + craftlink.pcl.com)
#   - Graham, Carlson, MNP, Sequeira Partners: no ATS platform identified;
#     postings surface only on their own site and/or Indeed/LinkedIn/Glassdoor
#   - Chandos, ASTRA, Style Developments, BAM: not confirmed either way
# So this list is empty by design, not by omission: none of Part G's named
# firms are coverable by this collector as scoped. Workday DOES have a
# public JSON API at the same shape as Greenhouse's
# (POST https://{tenant}.wd{N}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs)
# and would cover Ledcor and Clark Builders -- worth adding as a fifth
# collector type if Workday coverage matters enough to justify it (see
# docs/adr/ADR-001). It wasn't added here because it couldn't be verified
# end-to-end from this sandbox (outbound network policy blocked the test
# request), so shipping it untested would risk a silent, unverified
# integration -- exactly what ADR-001 already argues against for Job Bank.
#
# If you find a company from Part G that DOES use one of the four
# supported platforms, add it here:
#
# - company: "Example Construction Co."
#   board_type: greenhouse
#   slug: examplecorp

targets: []
